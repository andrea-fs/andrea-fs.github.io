<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Geist:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main class="hero">
    <div class="wrap">
      <h1 class="hero__name">404</h1>
      <p class="hero__sub">This page does not exist.</p>
      <div class="actions"><a class="btn" href="/">Back home</a></div>
    </div>
  </main>
</body>
</html>
